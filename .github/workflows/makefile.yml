name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
        xcodebuild -version
        xcodebuild -project Whitelist.xcodeproj -list

    - name: Clean
      run: |
        rm -rf DerivedData Payload Whitelist.ipa
        mkdir -p DerivedData

    # Single scheme-based build. Using -scheme (not -target) is REQUIRED:
    #   1. -derivedDataPath is only valid together with -scheme.
    #   2. Scheme builds wire up SPM package search paths correctly, so the
    #      LocalConsole dependency resolves into the SAME DerivedData that the
    #      build consumes (fixes "no such module 'LocalConsole'").
    #   3. Automatic SPM package resolution runs as part of the build itself,
    #      so no separate -resolvePackageDependencies step is needed (that
    #      flag short-circuits xcodebuild and skips compilation entirely).
    - name: Build
      run: |
        set -o pipefail
        xcodebuild -project Whitelist.xcodeproj \
          -scheme Whitelist \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
          ENABLE_PREVIEWS=NO \
          DEVELOPMENT_ASSET_PATHS="" \
          build | tee build.log || { echo '--- build log (tail) ---'; tail -n 200 build.log; exit 1; }

    - name: Package IPA
      run: |
        APP_PATH="DerivedData/Build/Products/Release-iphoneos/Whitelist.app"
        test -d "$APP_PATH" || { echo "ERROR: $APP_PATH not found"; exit 1; }
        chmod a+x bin/ldid
        bin/ldid -S"entitlements.plist" "$APP_PATH"
        rm -rf Payload
        mkdir Payload
        cp -r "$APP_PATH" Payload
        zip -r Whitelist.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Whitelist IPA
        path: Whitelist.ipa
