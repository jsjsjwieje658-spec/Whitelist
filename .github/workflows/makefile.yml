name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
        xcodebuild -version

    - name: Resolve Packages
      run: xcodebuild -project Whitelist.xcodeproj -target Whitelist -resolvePackageDependencies

    - name: Clean
      run: make clean

    - name: Build
      run: make build

    - name: Package IPA
      run: |
        make entitlements
        make package

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Whitelist IPA
        path: Whitelist.ipa
