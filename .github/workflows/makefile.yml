name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        ls /Applications/Xcode_*.app 2>/dev/null || true
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true
        xcodebuild -version

    - name: Verify build tools
      run: |
        xcodebuild -version
        swift --version

    - name: Clean previous artifacts
      run: make clean

    - name: Build
      run: make build

    - name: Package IPA
      run: |
        make entitlements
        make package

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Whitelist IPA
        path: Whitelist.ipa
